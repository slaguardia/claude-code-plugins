name: Validate Plugins

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The official validator owns manifest schema: it is the same check that
      # `/plugin install` runs, so a green build here means the marketplace
      # actually installs. It needs no auth and no API key.
      # It does NOT look at skill or command frontmatter.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate marketplace schema (official)
        run: claude plugin validate .

      # Our script owns what the official validator ignores: YAML frontmatter
      # in every command, skill, and agent file. A SKILL.md with no frontmatter
      # passes `claude plugin validate` and is silently dead at runtime.
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate skill and agent frontmatter
        run: bash scripts/validate-frontmatter.sh
